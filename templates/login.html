<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Acceso · SolNow Video Analytics</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #083954 0%, #106695 100%);
            padding: 16px;
        }
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 12px 40px rgba(8,57,84,0.3);
            padding: 32px 28px;
            width: 100%;
            max-width: 360px;
        }
        .card img { display: block; max-width: 150px; height: auto; margin: 0 auto 20px; }
        h1 { color: #083954; font-size: 18px; text-align: center; margin: 0 0 20px; }
        label { display: block; font-size: 12px; font-weight: 600; color: #7f8c8d; text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 6px; }
        input[type=password] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d9e0;
            border-radius: 6px;
            font-size: 15px;
            margin-bottom: 14px;
        }
        input[type=password]:focus { outline: none; border-color: #4A90C0; box-shadow: 0 0 0 3px rgba(74,144,192,0.15); }
        button {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 6px;
            background: #106695;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: #083954; }
        .error { background: #fdecea; color: #c0392b; border-radius: 6px; padding: 10px; font-size: 13px; margin-bottom: 14px; }
    </style>
</head>
<body>
    <form class="card" method="POST" action="/admin/login">
        <img src="/static/images/logo.png" alt="SolNow">
        <h1>Panel de administración</h1>
        {{if .Error}}<div class="error">{{.Error}}</div>{{end}}
        <input type="hidden" name="next" value="{{.Next}}">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required autofocus>
        <button type="submit">Entrar</button>
    </form>
</body>
</html>
