<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>{{.Title}} · SolNow</title>
    {{template "og_tags" .OG}}
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eef2f5;
            padding: 16px;
        }
        .card {
            background: white;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(8,57,84,0.12);
            padding: 36px 28px;
            max-width: 420px;
            text-align: center;
        }
        .card img { max-width: 150px; height: auto; margin-bottom: 20px; }
        h1 { color: #083954; font-size: 21px; margin: 0 0 10px; }
        p { color: #7f8c8d; font-size: 14px; line-height: 1.6; margin: 0 0 20px; }
        a { color: #106695; font-weight: 600; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <img src="/static/images/logo.png" alt="SolNow">
        <h1>{{.Title}}</h1>
        <p>{{.Message}}</p>
        <a href="https://solnow.io">Conoce SolNow →</a>
    </div>
</body>
</html>
