<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>{{.OG.Title}}</title>
    {{template "og_tags" .OG}}
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #083954 0%, #106695 100%);
            color: #2c3e50;
            padding: 16px;
        }
        .card {
            background: white;
            border-radius: 14px;
            box-shadow: 0 12px 40px rgba(8,57,84,0.3);
            padding: 32px 28px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .card img { max-width: 160px; height: auto; margin-bottom: 20px; }
        h1 { color: #083954; font-size: 20px; margin: 0 0 8px; }
        p { color: #7f8c8d; font-size: 14px; margin: 0 0 20px; line-height: 1.5; }
        input[type=password] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d9e0;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 12px;
        }
        input[type=password]:focus { outline: none; border-color: #4A90C0; box-shadow: 0 0 0 3px rgba(74,144,192,0.15); }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #106695;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: #083954; }
        .error { background: #fdecea; color: #c0392b; border-radius: 8px; padding: 10px; font-size: 13px; margin-bottom: 12px; }
    </style>
</head>
<body>
    <form class="card" method="POST">
        <img src="/static/images/logo.png" alt="SolNow">
        <h1>{{if .CompanyName}}{{.CompanyName}}, tu demo está lista{{else}}Tu demo está lista{{end}}</h1>
        <p>Este vídeo está protegido. Introduce la contraseña que te hemos enviado para verlo.</p>
        {{if .Error}}<div class="error">{{.Error}}</div>{{end}}
        <input type="password" name="password" placeholder="Contraseña" autocomplete="current-password" required autofocus>
        <button type="submit">Ver la demo</button>
    </form>
</body>
</html>
